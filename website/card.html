<script>
const card=document.getElementById('card'),stage=document.getElementById('stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let ry=-18,rx=8,ty=-18,tx=8,down=false,drag=false,lx=0,ly=0,sx=0,sy=0,vy=0,idle=0,t0=performance.now();

function go(deg){
  ty=deg;tx=6;idle=performance.now()+2500;
}
function flip(){
  go(Math.round(ty/180)*180+180);
}

stage.addEventListener('pointerdown',e=>{down=true;drag=false;lx=sx=e.clientX;ly=sy=e.clientY});
stage.addEventListener('pointermove',e=>{
  if(!down)return;
  if(!drag){
    if(Math.hypot(e.clientX-sx,e.clientY-sy)<8)return;
    drag=true;
    try{stage.setPointerCapture(e.pointerId)}catch(_){}
  }
  const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  ty+=dx*.45;tx=Math.max(-35,Math.min(35,tx-dy*.3));vy=dx*.45;
});
const end=()=>{
  if(!down)return;
  down=false;
  if(drag){
    ty+=vy*6;
    idle=performance.now()+2500;
  }
};
stage.addEventListener('pointerup',end);
stage.addEventListener('pointercancel',end);
stage.addEventListener('click',e=>{
  if(drag){
    e.preventDefault();
    e.stopPropagation();
    drag=false;
    return;
  }
  if(!e.target.closest('.hot')){
    flip();
  }
});
stage.addEventListener('dragstart',e=>e.preventDefault());
stage.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(ty-90);
  if(e.key==='ArrowRight')go(ty+90);
  if(e.key===' '||e.key==='Enter')flip();
});

function frame(now){
  let gy=ty,gx=tx;
  if(!down&&!reduce&&now>idle){
    const k=(now-t0)/1000;
    gy=ty+Math.sin(k*.8)*8;
    gx=tx+Math.cos(k*.6)*3;
  }
  ry+=(gy-ry)*(drag?.4:.08);
  rx+=(gx-rx)*.1;
  card.style.transform=`rotateX(${-rx}deg) rotateY(${ry}deg)`;
  stage.style.setProperty('--g',(50+Math.sin(ry*Math.PI/180)*60)+'%');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
